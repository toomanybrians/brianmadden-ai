# Daily ingest + brief + publish (Day 6 automation)
# ==================================================
# Runs the whole synthesis-to-draft chain unattended every weekday morning
# — ingest, brief, publish — commits whatever it produces straight to
# `main`, and emails Brian the rendered, Substack-ready HTML (2026-08-20:
# originally this stopped after brief.py and left publish.py as a manual
# step, but Brian's actual daily habit is "paste this into Substack over
# coffee," which only works if the draft is already in his inbox when he
# sits down — see BUILD.md open decision #3 for the 08:00-run vs.
# 9-11am-review split this still respects). Actually clicking publish on
# Substack itself remains manual — nothing here can do that (no posting
# API exists yet, D7).
#
# WHY 06:00 UTC
# -------------
# Target is 08:00 Paris time (BUILD.md open decision #3), but GitHub
# Actions cron is always UTC and doesn't observe DST. 06:00 UTC matches
# Paris exactly under CEST (summer, UTC+2 — true today). Under CET
# (winter, UTC+1) this drifts to 07:00 Paris — an hour early, not late.
# Deliberately not solved with a second seasonal cron entry: per Brian's
# own reasoning for the 08:00 target, "not much breaks overnight," so an
# hour of drift in either direction doesn't matter enough to double the
# schedule complexity.
#
# WHY SELF-HOSTED (2026-09-25)
# ----------------------------
# Runs on Brian's always-on home box (a Beelink mini PC, Ubuntu 24.04,
# runner name/label `beelink`), not GitHub's hosted runners. Substack's
# Cloudflare front 403s GitHub's datacenter IP ranges on every run
# (BUILD.md open decision #16 — all 13 remaining RSS-polled Substack
# feeds, every day), and X's OAuth refresh 401'd from Actions while
# succeeding from residential networks. Same feeds from the home box:
# 13/13 200. Secrets still come from GitHub Actions Secrets exactly as
# before — nothing on the box's runner workspace holds a .env. Because
# this repo is public, the runner is only ever targeted by this
# workflow, which only fires on schedule/workflow_dispatch (never on
# pull_request), and fork PRs from any outside contributor require
# approval before any workflow runs. The runner service is
# `actions.runner.toomanybrians-brianmadden-ai.beelink` on the box.
#
# X (brianmaddenai home timeline) INGESTION
# ------------------------------------------
# Wired in for real 2026-08-28. Its OAuth refresh token rotates on use;
# skills/ingest/ingest.py's _persist_x_refresh_token() writes the
# rotated value back to this repo's own X_REFRESH_TOKEN secret (via the
# gh CLI, authenticated with SECRETS_WRITE_PAT below) in addition to the
# local .env write _update_env_var() already did — without that,
# X_REFRESH_TOKEN here would go stale on the very next rotation and
# every run after the first would fail. The default GITHUB_TOKEN can't
# do this itself; managing repository secrets isn't one of the
# permissions it can be granted at any scope, confirmed against GitHub's
# own docs. Missing X credentials still fail gracefully either way
# (x_is_configured() gate in ingest.py skips the source with a logged
# reason, same as any other missing-credential source) rather than
# breaking the run.
#
# REQUIRED SECRETS (set in GitHub repo settings — see .env.example for
# what each is for)
# --------------------------------------------------------------------
#   ANTHROPIC_API_KEY                              — required
#   GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_REFRESH_TOKEN
#                                                   — brain@ inbox polling,
#                                                     and sending the
#                                                     morning email (needs
#                                                     the gmail.send scope,
#                                                     not just gmail.modify)
#   BRIAN_EMAIL                                    — verifies brain@
#                                                     personal flags, and
#                                                     is the morning
#                                                     email's recipient
#   OPENAI_API_KEY                                 — podcast transcription
#   X_CLIENT_ID / X_CLIENT_SECRET / X_ACCESS_TOKEN / X_REFRESH_TOKEN
#                                                   — brianmaddenai home
#                                                     timeline polling
#   SECRETS_WRITE_PAT                              — fine-grained PAT,
#                                                     "Secrets: write" on
#                                                     this repo only, lets
#                                                     the run above write
#                                                     X_REFRESH_TOKEN back
#                                                     to itself after a
#                                                     rotation

name: Daily ingest + brief + publish

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: [self-hosted, beelink]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The box's system Python is 3.12 (Ubuntu 24.04), same version the
      # hosted runner used, but 24.04 refuses a system-wide pip install
      # (PEP 668), so deps live in a venv that persists between runs
      # outside the workspace (checkout's clean step would wipe one
      # inside it). Putting its bin/ on GITHUB_PATH makes every later
      # step's `python3` the venv's.
      - name: Set up Python venv + dependencies
        run: |
          VENV="$HOME/.cache/brianmadden-ai-venv"
          [ -x "$VENV/bin/python3" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q -r requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "brianmadden.ai"
          git config user.email "brain@brianmadden.ai"

      - name: Run ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          BRIAN_EMAIL: ${{ secrets.BRIAN_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          SECRETS_WRITE_PAT: ${{ secrets.SECRETS_WRITE_PAT }}
        run: python3 skills/ingest/ingest.py

      - name: Run brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 skills/brief/brief.py

      # Publishes + emails BEFORE the commit below, same order Brian's own
      # local runs use — the tradeoff (skills/brief/README.md) is that the
      # disclosure line's "raw notes" link falls back to a plain
      # main-branch blob link instead of a permalink to this exact batch's
      # commit, since that commit doesn't exist yet at render time. Guarded
      # on today's brief file actually existing: a quiet day (no new notes)
      # means brief.py wrote nothing, and publish.py has nothing to work
      # from.
      - name: Run publish + email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          BRIAN_EMAIL: ${{ secrets.BRIAN_EMAIL }}
        run: |
          BRIEF_PATH="outputs/technical-briefings/$(date -u +%Y/%m/%Y-%m-%d).md"
          if [ -f "$BRIEF_PATH" ]; then
            python3 skills/brief/publish.py --send
          else
            echo "No brief written today (quiet day) — nothing to publish"
          fi

      # Weekly Wrap Up's "initial recap" (skills/weekly/gather.py) used to
      # run here automatically every Friday. Removed 2026-09-04, Brian's
      # own call: an auto-run right after the day's Daily Briefing always
      # missed whatever he did in reaction to Friday's own post (restacking
      # it, commenting on it) — those actions happen after he's read the
      # email, not before it's sent. He now reads Friday's post as normal,
      # then manually runs `python3 skills/weekly/gather.py` (or starts
      # `/weekly-update`, which runs it for him) whenever he's actually
      # ready to sit down with it, so the prep doc always reflects
      # everything he's flagged, not just what existed a few hours earlier.

      # Keeps ingest/ to a rolling 30 days in the working tree (added
      # 2026-09-25, Brian's call). Runs after brief + publish so nothing
      # today reads a note it removed; pruned notes stay in git history,
      # and the commit step's `git add -A -- ingest/` picks up the
      # deletions. Non-fatal: a prune failure shouldn't block the day's
      # commit.
      - name: Prune ingest notes older than 30 days
        continue-on-error: true
        run: python3 scripts/prune_ingest.py --days 30

      - name: Commit and push
        id: commit
        run: |
          git add -A -- ingest/ outputs/technical-briefings/ outputs/published/ outputs/weekly-updates/ outputs/canon-triage/ sources/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Run today's ingest + daily brief ($(date -u +%Y-%m-%d)) [automated]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN deliberately does NOT
      # trigger other on:push workflows (GitHub's own loop-prevention
      # behavior) — confirmed the hard way on the very first real run,
      # 2026-08-19: ingest+brief committed fine but check-docs.yml and
      # sync-to-cloudflare-kv.yml both silently never fired, so today's
      # content sat on main without reaching the live KV store until
      # triggered by hand. Explicit workflow_dispatch calls below aren't
      # subject to that suppression, so this is the fix, not a workaround.
      - name: Trigger downstream checks + KV sync
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run check-docs.yml --ref main
          gh workflow run sync-to-cloudflare-kv.yml --ref main
