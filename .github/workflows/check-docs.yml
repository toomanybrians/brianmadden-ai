name: Check doc accuracy

# Catches stated counts (Citrix posts, LinkedIn articles, frameworks, talks),
# index numbering, and the CLAUDE.md repo-structure tree drifting out of
# sync with what's actually in the repo. See scripts/check_doc_accuracy.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run doc accuracy checks
        run: python3 scripts/check_doc_accuracy.py
      - name: Machine indexes and repo-size numbers are current
        run: |
          pip install --quiet PyYAML==6.0.3
          python3 scripts/build_indexes.py --check || { echo '::error::Run: python3 scripts/build_indexes.py --write, then commit'; exit 1; }
      - name: Public-safety lint (this repo is public)
        run: python3 scripts/check_public_safe.py
