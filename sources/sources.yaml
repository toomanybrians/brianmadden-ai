# sources.yaml — feed registry for the ingest skill
#
# Seeded from me/links.md (2026-08-10). Day 3 (2026-08-10): feed_url values
# looked up and verified (HTTP 200) for every source with a real feed —
# podcast feeds confirmed via the iTunes Search API's feedUrl field, blog/
# newsletter feeds by checking the standard /feed paths, Nate B. Jones's
# YouTube feed by resolving his channel ID and hitting the YouTube RSS
# endpoint. Paul Roetzer and Aaron Levie were dropped from this list (Day 3)
# — personal LinkedIn profiles don't expose RSS, and both are covered
# indirectly (Roetzer via the-artificial-intelligence-show and
# exec-ai-insider-weekly; Levie may resurface if a non-LinkedIn feed turns
# up, e.g. X/Twitter — flagged, not yet looked up). ExecAI Insider Weekly is
# kept with feed_url: null — it's a real, wanted source, just email-only
# (arrives by email, no discoverable RSS), so it needs the email-ingestion
# path being designed under BUILD.md open decision #7, not a feed poll.
#
# Brian's own blog/LinkedIn are deliberately excluded — this repo publishes
# that content directly, it doesn't ingest it as a third-party source.
#
# Fields:
#   id        — stable slug, used in ingest note frontmatter
#   name      — display name
#   type      — person | podcast | newsletter
#   url       — homepage / profile link (from me/links.md)
#   feed_url  — actual feed endpoint for polling (null until confirmed)
#   priority  — must-follow | regular (from links.md's own grouping)
#   note      — why it's followed, carried over from links.md
#   lens      — optional short tag, Brian's personal read of the source
#               (e.g. "skeptical-but-useful"). Free-form, not a fixed enum —
#               deliberately open so new tags can be invented over time
#               rather than requiring a code change. Blank = no particular
#               lens, treat neutrally.
#   pov       — optional longer freeform field, written like a mini-prompt:
#               fed directly to the ingest skill's extraction prompt as
#               framing instruction (e.g. "surface where he disagrees with
#               consensus"). Also intended for reuse by the Day-5 briefing
#               skill, not just ingest. Blank = no framing applied.
#   ingest_method — "email" routes this source through fetch_entries_email()
#               (polls brain@brianmadden.ai via Gmail API) instead of the
#               feed_url poll. "x" routes through fetch_entries_x() instead
#               (polls the brianmaddenai account's home timeline — see the
#               x-timeline entry below). Omit for normal RSS/Atom sources.
#   transcript_mode — podcast sources only. "published" fetches a real
#               transcript URL (currently only 80000-hours-podcast has one,
#               via its feed's <podcast:transcript> tag). "transcribe"
#               downloads the audio enclosure and runs it through
#               skills/lib/transcribe.py (OpenAI Whisper). Omit/unset for
#               show-notes-only (the old behavior). See
#               docs/full-source-text-ingestion.md.
#
# lens/pov added Day 4 (2026-08-10), resolving BUILD.md open decision #6.
# Both fields are optional and mostly unset — Brian expects to steer them in
# over time rather than have all 56 sources opinionated at once. Backfilled
# here only for the two sources whose `note` already carried implicit lens
# language (moonshots, marcus-on-ai) as worked examples.
#
# ingest_method: email added 2026-08-12, resolving open decision #7a's
# design (see BUILD.md). Originally gated on a per-source `sender` field
# (only look at pre-approved senders) — reverted 2026-08-13, Brian's call:
# subscribing something to brain@ already *is* the curation step, so a
# second sender allowlist was solving a problem that didn't exist. There is
# now exactly one email source below, `brain-inbox`, which scans everything
# arriving there — whatever's there is fair game for the same NOT_RELEVANT
# extraction judgment every other source already gets. No per-newsletter
# entries needed; each note's real sender comes from the message's own
# From header, not a registry lookup.
#
# Auto-flip added 2026-08-25 (BUILD.md open decision #16's follow-up):
# when a real brain@ email's sender matches an *existing* feed_url-based
# row (by domain/subdomain — see ingest.py's find_feed_source_for_email_
# sender()), that row gets rewritten in place — feed_url nulled, `sender`
# and `ingest_method: email` added — instead of registering a lookalike
# duplicate the way a genuinely new sender would. Targeted at the ~39
# sources whose *.substack.com feed_url is blocked from GitHub Actions
# (see BUILD.md open decision #16): once Brian subscribes one there for
# email delivery, its existing curated row (note/lens/pov and all)
# switches over automatically rather than losing that curation to a
# fresh auto-registered entry. Only fires for a row with no `sender` yet
# and `ingest_method` not already `email` — already-flipped/documented
# rows are untouched.

sources:
