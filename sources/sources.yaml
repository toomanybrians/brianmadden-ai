    feed_url: null
    ingest_method: x
    priority: must-follow
    note: >
      Everyone brianmaddenai follows on X, pulled via the reverse-chronological
      home timeline endpoint in one call — the follow list itself is the
      source list here, not individual entries in this file (see
      docs/full-source-text-ingestion.md Workstream F). Retweets/quotes pull
      in the full referenced post; links to external pages get that page's
      content fetched too.

